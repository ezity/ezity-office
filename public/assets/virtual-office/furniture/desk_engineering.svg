<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 200" width="256" height="200">
  <defs>
    <linearGradient id="engTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="eShd" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <!-- Shadow -->
  <polygon points="128,185 235,130 145,85 35,135" fill="#0f172a" fill-opacity="0.28" filter="url(#eShd)"/>
  <!-- Metal Legs -->
  <line x1="52" y1="114" x2="52" y2="158" stroke="#0284c7" stroke-width="4"/>
  <line x1="128" y1="152" x2="128" y2="175" stroke="#0284c7" stroke-width="4"/>
  <line x1="204" y1="114" x2="204" y2="158" stroke="#0369a1" stroke-width="4"/>
  <!-- Desk Top -->
  <polygon points="45,110 128,152 128,157 45,115" fill="#0f172a"/>
  <polygon points="128,152 211,110 211,115 128,157" fill="#020617"/>
  <polygon points="128,68 211,110 128,152 45,110" fill="url(#engTop)" stroke="#0284c7" stroke-width="1.5"/>
  <!-- Dual Monitors (Left & Right Angled) -->
  <!-- Left Monitor -->
  <polygon points="110,65 132,76 132,102 110,91" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
  <!-- Code lines abstract -->
  <line x1="114" y1="76" x2="128" y2="83" stroke="#e0f2fe" stroke-width="1.5"/>
  <line x1="114" y1="81" x2="124" y2="86" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="114" y1="86" x2="127" y2="92" stroke="#a7f3d0" stroke-width="1.5"/>
  <!-- Right Monitor -->
  <polygon points="138,79 160,90 160,116 138,105" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
  <line x1="142" y1="90" x2="156" y2="97" stroke="#fbcfe8" stroke-width="1.5"/>
  <line x1="142" y1="95" x2="152" y2="100" stroke="#fde047" stroke-width="1.5"/>
  <!-- Mechanical Keyboard -->
  <polygon points="105,120 125,130 115,135 95,125" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
  <!-- Optical Mouse -->
  <ellipse cx="132" cy="132" rx="3.5" ry="2.5" fill="#0ea5e9"/>
</svg>