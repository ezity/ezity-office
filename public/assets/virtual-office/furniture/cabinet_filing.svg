<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 210" width="160" height="210">
  <defs>
    <linearGradient id="cabTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#cbd5e1"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient>
    <linearGradient id="cabFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#64748b"/></linearGradient>
    <linearGradient id="cabRight" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#64748b"/><stop offset="100%" stop-color="#475569"/></linearGradient>
    <filter id="cShd" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <!-- Shadow -->
  <polygon points="80,200 135,172 90,150 35,178" fill="#0f172a" fill-opacity="0.25" filter="url(#cShd)"/>
  <!-- Cabinet Front -->
  <polygon points="40,90 80,110 80,192 40,172" fill="url(#cabFront)" stroke="#475569" stroke-width="1"/>
  <!-- Cabinet Right Side -->
  <polygon points="80,110 120,90 120,172 80,192" fill="url(#cabRight)" stroke="#334155" stroke-width="1"/>
  <!-- Cabinet Top -->
  <polygon points="80,70 120,90 80,110 40,90" fill="url(#cabTop)" stroke="#94a3b8" stroke-width="1"/>
  <!-- 3 Drawer Divisions & Teal Label Badges -->
  <!-- Drawer 1 -->
  <line x1="43" y1="117" x2="77" y2="134" stroke="#475569" stroke-width="1.5"/>
  <rect x="58" y="121" width="6" height="3" fill="#0d9488" rx="1"/>
  <!-- Drawer 2 -->
  <line x1="43" y1="144" x2="77" y2="161" stroke="#475569" stroke-width="1.5"/>
  <rect x="58" y="148" width="6" height="3" fill="#0d9488" rx="1"/>
  <!-- Drawer 3 -->
  <line x1="43" y1="171" x2="77" y2="188" stroke="#475569" stroke-width="1.5"/>
  <rect x="58" y="175" width="6" height="3" fill="#0d9488" rx="1"/>
</svg>