<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="glassTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="mShd" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <!-- Shadow -->
  <polygon points="160,205 295,138 180,80 45,148" fill="#1e1b4b" fill-opacity="0.25" filter="url(#mShd)"/>
  <!-- Central Pedestal Bases -->
  <rect x="110" y="130" width="16" height="35" rx="3" fill="#64748b"/>
  <rect x="194" y="130" width="16" height="35" rx="3" fill="#475569"/>
  <!-- Glass Table Bevel -->
  <polygon points="55,128 160,180 160,185 55,133" fill="#38bdf8" fill-opacity="0.6"/>
  <polygon points="160,180 265,128 265,133 160,185" fill="#0284c7" fill-opacity="0.6"/>
  <!-- Glass Top Surface -->
  <polygon points="160,75 265,128 160,180 55,128" fill="url(#glassTop)" stroke="#38bdf8" stroke-width="2"/>
  <!-- Center Inset Power / AV Module -->
  <polygon points="160,118 190,133 160,148 130,133" fill="#334155" stroke="#0ea5e9" stroke-width="1"/>
</svg>