<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 200" width="256" height="200">
  <defs>
    <linearGradient id="oakTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#d4b996"/>
    </linearGradient>
    <linearGradient id="oakFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfa27a"/>
      <stop offset="100%" stop-color="#967954"/>
    </linearGradient>
    <linearGradient id="oakRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9e805d"/>
      <stop offset="100%" stop-color="#735738"/>
    </linearGradient>
    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <!-- Soft Shadow -->
  <polygon points="128,185 235,130 145,85 35,135" fill="#0f172a" fill-opacity="0.25" filter="url(#fShadow)"/>
  <!-- Drawers / Base -->
  <polygon points="52,118 80,132 80,168 52,154" fill="url(#oakFront)"/>
  <polygon points="176,132 204,118 204,154 176,168" fill="url(#oakRight)"/>
  <polygon points="80,132 176,132 176,155 80,155" fill="#826645"/>
  <!-- Desk Top -->
  <polygon points="45,110 128,152 128,157 45,115" fill="url(#oakFront)"/>
  <polygon points="128,152 211,110 211,115 128,157" fill="url(#oakRight)"/>
  <polygon points="128,68 211,110 128,152 45,110" fill="url(#oakTop)" stroke="#ba9d77" stroke-width="1.5"/>
  <!-- Financial Monitor (Showing Chart Outline) -->
  <polygon points="128,62 155,75 155,102 128,89" fill="#0f172a" stroke="#059669" stroke-width="1"/>
  <polygon points="129,64 153,76 153,100 129,88" fill="#10b981" fill-opacity="0.8"/>
  <!-- Mini Bar Chart Inside Monitor -->
  <line x1="134" y1="84" x2="134" y2="76" stroke="#ffffff" stroke-width="2"/>
  <line x1="140" y1="88" x2="140" y2="74" stroke="#ffffff" stroke-width="2"/>
  <line x1="146" y1="92" x2="146" y2="78" stroke="#ffffff" stroke-width="2"/>
  <!-- Document Tray / Ledger Invoices -->
  <polygon points="75,108 95,118 85,123 65,113" fill="#059669" stroke="#047857" stroke-width="1"/>
  <polygon points="76,106 94,115 86,119 68,110" fill="#f8fafc"/>
  <!-- Calculator Accent -->
  <polygon points="160,118 175,125 168,129 153,122" fill="#334155"/>
</svg>