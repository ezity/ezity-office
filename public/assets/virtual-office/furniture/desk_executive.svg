<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 200" width="256" height="200">
  <defs>
    <linearGradient id="execTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a301f"/>
      <stop offset="100%" stop-color="#2c1a10"/>
    </linearGradient>
    <linearGradient id="execFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b2315"/>
      <stop offset="100%" stop-color="#1e1109"/>
    </linearGradient>
    <linearGradient id="execRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a180e"/>
      <stop offset="100%" stop-color="#140a05"/>
    </linearGradient>
    <linearGradient id="brassTrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <!-- Contact Shadow -->
  <polygon points="128,185 235,130 145,85 35,135" fill="#1e1b4b" fill-opacity="0.28" filter="url(#softShadow)"/>
  
  <!-- Desk Body (Pedestals & Modesty Panel) -->
  <!-- Left Pedestal Front -->
  <polygon points="50,118 78,133 78,168 50,152" fill="url(#execFront)"/>
  <!-- Right Pedestal Front & Right Side -->
  <polygon points="175,133 205,118 205,152 175,168" fill="url(#execRight)"/>
  <!-- Front Modesty Panel -->
  <polygon points="78,133 175,133 175,158 78,158" fill="#25160d"/>
  
  <!-- Brass Accent Trim Line -->
  <polygon points="46,112 128,154 210,112 210,115 128,157 46,115" fill="url(#brassTrim)"/>

  <!-- Desk Main Top Slab -->
  <!-- Front Bevel -->
  <polygon points="45,110 128,152 128,157 45,115" fill="#301b0e"/>
  <!-- Right Bevel -->
  <polygon points="128,152 211,110 211,115 128,157" fill="#1c0f07"/>
  <!-- Top Surface -->
  <polygon points="128,68 211,110 128,152 45,110" fill="url(#execTop)" stroke="#5c3d28" stroke-width="1.5"/>

  <!-- Leather Inlay Blotter Pad -->
  <polygon points="128,84 185,113 128,142 71,113" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  
  <!-- Minimalist Executive Laptop / Display -->
  <polygon points="128,87 148,97 148,99 128,89" fill="#94a3b8"/>
  <polygon points="128,60 148,70 148,97 128,87" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8"/>
  <polygon points="129,62 147,71 147,95 129,86" fill="#0284c7" fill-opacity="0.85"/>
  <!-- Desk Lamp (Brushed Brass) -->
  <circle cx="68" cy="102" r="4" fill="url(#brassTrim)"/>
  <path d="M68,102 Q64,90 74,84" stroke="url(#brassTrim)" stroke-width="2" fill="none"/>
  <path d="M72,82 L82,87 L78,92 Z" fill="#fbbf24"/>
</svg>