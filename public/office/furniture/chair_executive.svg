<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 190" width="160" height="190">
  <defs>
    <filter id="chairShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <linearGradient id="leatherGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cushionGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <!-- Cast Shadow -->
  <ellipse cx="80" cy="172" rx="35" ry="12" fill="#0f172a" fill-opacity="0.25" filter="url(#chairShadow)"/>
  <!-- 5-Star Chrome Base & Casters -->
  <path d="M80,158 L60,166 M80,158 L100,166 M80,158 L72,172 M80,158 L88,172 M80,158 L80,175" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="80" cy="154" r="5" fill="#64748b"/>
  <!-- Gas Lift Cylinder -->
  <rect x="77" y="132" width="6" height="22" rx="2" fill="#475569"/>
  <!-- Seat Cushion Top & Front -->
  <polygon points="80,132 112,118 112,125 80,139" fill="#1e1b4b"/>
  <polygon points="80,132 48,118 48,125 80,139" fill="#312e81"/>
  <polygon points="80,105 112,118 80,132 48,118" fill="url(#cushionGrad)" stroke="#4338ca" stroke-width="1.5"/>
  <!-- Armrests -->
  <path d="M46,112 L46,95 L58,100" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M114,112 L114,95 L102,100" stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Ergonomic High Backrest -->
  <path d="M60,110 C56,70 58,40 80,38 C102,40 104,70 100,110 Z" fill="url(#leatherGrad)" stroke="#4338ca" stroke-width="1.5"/>
  <!-- Headrest Cushion -->
  <rect x="68" y="24" width="24" height="15" rx="5" fill="#3730a3" stroke="#4f46e5" stroke-width="1.2"/>
</svg>